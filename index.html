<title>Barn Find Kings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D stage up top, a worn-steel control sheet docked below (right rail on desktop). */
:root{
  --ink:#111315; --panel:#191b1e; --panel2:#212428; --raise:#2a2e33; --line:#33383e;
  --cream:#efe5cf; --muted:#9e978a; --amber:#e9a23b; --amber-ink:#2a1a05; --teal:#5fb0a2; --rust:#c95b34; --good:#8cbf6c;
  --f-disp:'Bowlby One SC','Arial Black',Impact,sans-serif;
  --f-ui:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'Barlow',system-ui,sans-serif;
  --f-num:'Martian Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--cream)}
body{font:15px/1.4 var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
body.titling #hud,body.titling #camtools{visibility:hidden}
@media (min-width:900px){
  #app{grid-template-columns:minmax(0,1fr) 430px;grid-template-rows:auto minmax(0,1fr)}
  #hud{grid-column:1/-1}
  #sheet{grid-row:2;grid-column:2;height:auto!important;border-top:0!important;border-left:1px solid var(--line)}
}
/* HUD */
#hud{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{font:20px/1 var(--f-disp);letter-spacing:.01em;color:var(--cream);white-space:nowrap}
.brand em{font-style:normal;color:var(--amber)}
.stats{display:flex;gap:14px;margin-left:auto;min-width:0}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.05}
.stat label{font:600 10px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stat b{font:600 14px/1.2 var(--f-num);font-variant-numeric:tabular-nums}
#hCash{color:var(--good)}
.hbtn{font:700 12px/1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);white-space:nowrap}
.hbtn:active{transform:translateY(1px)}
@media (max-width:480px){.brand{font-size:16px}.stats{gap:10px;margin-left:0}.stat b{font-size:12.5px}#hud{gap:8px;padding-inline:12px}.taste{grid-template-columns:1fr}.hbtn{padding:9px 8px}}
@media (max-width:440px){.brand{display:none}#btnSleep{margin-left:auto}}
/* Stage */
#stage{position:relative;min-height:0;overflow:hidden;background:#000}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#plate{position:absolute;left:14px;top:12px;pointer-events:none;max-width:70%;text-shadow:0 2px 12px rgba(0,0,0,.7)}
#plate .y{font:600 12px/1 var(--f-ui);letter-spacing:.18em;text-transform:uppercase;color:var(--amber)}
#plate .n{font:22px/1.05 var(--f-disp);margin-top:4px;text-wrap:balance}
#plate .s{font:500 13px/1.2 var(--f-ui);letter-spacing:.06em;color:#e8dcc4;margin-top:4px;text-transform:uppercase}
#camtools{position:absolute;right:12px;top:12px;display:flex;gap:6px}
.cbtn{font:700 11px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;padding:8px 9px;border-radius:5px;background:rgba(17,19,21,.62);border:1px solid rgba(239,229,207,.18);backdrop-filter:blur(6px)}
.cbtn.on{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
#toast{position:absolute;left:50%;top:74px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:5;width:max-content;max-width:calc(100% - 32px)}
.t{font:600 14px/1.25 var(--f-ui);letter-spacing:.04em;padding:8px 14px;border-radius:6px;background:rgba(17,19,21,.88);border:1px solid var(--line);animation:tin .25s ease-out;text-align:center}
.t.gold{border-color:var(--amber);color:var(--amber)} .t.bad{border-color:var(--rust);color:#ffb8a0} .t.good{border-color:var(--good);color:#cfeab8}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
/* Switch box */
#switchbox{position:absolute;left:8px;right:8px;bottom:8px;z-index:3;display:flex;justify-content:flex-start;pointer-events:none}
#switchbox>*{pointer-events:auto}
.sbx{width:100%;background:rgba(22,24,27,.74);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(239,229,207,.16);border-radius:12px;padding:6px 8px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.sbrow{display:flex;align-items:center;gap:8px}.sbrow+.sbrow{margin-top:6px}
.sbrow label{font:700 10px/1 var(--f-ui);letter-spacing:.14em;color:var(--muted)}
.sbrow input[type=range]{flex:1;min-width:0;height:24px;accent-color:var(--amber)}
.sbrow .psi{min-width:48px;text-align:right;font-size:10.5px}
.sbx .x{width:28px;height:28px;flex:none;border-radius:50%;background:rgba(255,255,255,.08);color:var(--muted);font:700 14px/1 var(--f-ui)}
.pills{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px;flex:1}
.pills button{height:30px;border-radius:7px;background:linear-gradient(180deg,#d9dde2,#8d949c);color:#15181b;font:700 10.5px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);padding:0 2px;white-space:nowrap}
.pills button:active{transform:translateY(1px)}.pills button.red{background:linear-gradient(180deg,#f07a52,#a8381a);color:#fff}
.sbx h5{margin:0 2px 6px;font:700 10px/1 var(--f-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.sbx h5 button{color:var(--muted);font:inherit}
.sw{display:grid;grid-template-columns:repeat(4,58px);gap:5px}
.sw button{height:40px;border-radius:6px;background:linear-gradient(180deg,#d9dde2,#8d949c);color:#15181b;font:700 11px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 2px 0 #0c0d0f}
.sw button:active,.sw button.hot{transform:translateY(2px);box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}
.sw button.red{background:linear-gradient(180deg,#f07a52,#a8381a);color:#fff}
.air{display:flex;gap:10px;align-items:stretch}
.air .col{display:flex;flex-direction:column;align-items:center;gap:4px;font:700 10px/1 var(--f-ui);letter-spacing:.14em;color:var(--muted)}
.air input[type=range]{writing-mode:vertical-lr;direction:rtl;width:30px;height:92px;accent-color:var(--amber)}
.air .btns{display:grid;gap:5px}
.air .btns button{padding:0 12px;height:28px;border-radius:6px;background:linear-gradient(180deg,#d9dde2,#8d949c);color:#15181b;font:700 11px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.psi{font:600 11px/1 var(--f-num);color:var(--amber)}
/* Sheet */
#sheet{height:min(47vh,470px);display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);min-height:0}
#sheet.collapsed{height:auto}
#coach{position:absolute;left:10px;right:10px;bottom:10px;z-index:6;background:rgba(18,14,10,.95);border:2px solid var(--amber);border-radius:12px;padding:12px 14px 12px;color:var(--cream);font:500 16px/1.38 var(--f-body);box-shadow:0 10px 30px rgba(0,0,0,.55);max-width:560px;margin:0 auto}
#coach .st{font:700 12px/1 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin-bottom:6px;display:flex;align-items:center;gap:8px}
#coach .st .pips{display:flex;gap:4px;margin-left:auto}#coach .st .pips i{width:7px;height:7px;border-radius:50%;background:rgba(233,162,59,.25)}#coach .st .pips i.on{background:var(--amber)}
#coach b{color:#ffcf7a;font-weight:700}
#coach .cr{display:flex;gap:8px;margin-top:10px;align-items:center}
#coach .skip{margin-left:auto;background:none;border:0;color:var(--muted);font:600 13px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;padding:6px 2px;cursor:pointer}
.coach-glow{animation:cglow 1.1s ease-in-out infinite;outline:3px solid var(--amber)!important;outline-offset:2px;position:relative;z-index:2}
@keyframes cglow{0%,100%{outline-color:var(--amber);box-shadow:0 0 0 0 rgba(233,162,59,.55)}50%{outline-color:#ffd58f;box-shadow:0 0 0 7px rgba(233,162,59,.0)}}
.howto ol{margin:8px 0 6px 20px;padding:0}.howto li{margin:6px 0;font-size:15.5px;line-height:1.4}.howto h4{margin-top:14px}.howto p{font-size:15px;line-height:1.45}
.howto .big{font:500 17px/1.42 var(--f-body);color:var(--cream)}.howto b{font-family:var(--f-body);font-weight:700;color:#ffcf7a}.howto ol{font-family:var(--f-body)}
#sheet.collapsed #panel{display:none}
#panel{flex:1;overflow-y:auto;padding:14px 16px 18px;min-height:0;-webkit-overflow-scrolling:touch}
#tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 9px;font:700 11px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);position:relative}
#tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--amber)}
#tabs button.on::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--amber);border-radius:0 0 3px 3px}
#tabs .dot{position:absolute;top:6px;right:calc(50% - 18px);width:7px;height:7px;border-radius:50%;background:var(--rust)}
/* Panel content */
h2.tname{font:24px/1.05 var(--f-disp);margin:2px 0 4px;text-wrap:balance}
h3{font:20px/1.1 var(--f-disp);margin:0 0 6px;text-wrap:balance}
h4{font:700 12px/1 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
p{margin:0 0 10px;color:#d9cfba;max-width:62ch}
.sub{font:500 14px/1.2 var(--f-ui);letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.muted{color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.pos{color:var(--good)} .neg{color:var(--rust)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{font:700 14px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;padding:12px 16px;border-radius:7px;background:var(--amber);color:var(--amber-ink);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--line);box-shadow:none}
.btn.teal{background:var(--teal);color:#0d2420}
.btn.sm{padding:9px 11px;font-size:12.5px}
.btn[disabled],.chip[disabled]{opacity:.38;pointer-events:none}
.seg{display:flex;gap:4px;background:var(--ink);padding:4px;border-radius:9px;border:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.seg button{flex:1;padding:9px 10px;border-radius:6px;font:700 13px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--raise);color:var(--cream)}
.kv3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kv3>div{background:var(--panel2);border-radius:7px;padding:9px 10px;min-width:0}
.kv3 label,.lbl{display:block;font:700 10px/1 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.kv3 b{font:600 14px/1.1 var(--f-num);font-variant-numeric:tabular-nums}
.gauges{display:grid;gap:7px}
.g{display:grid;grid-template-columns:118px 1fr 34px;gap:10px;align-items:center;font:600 13px/1 var(--f-ui);letter-spacing:.04em}
.g b{font:600 12px/1 var(--f-num);text-align:right;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:#0c0d0e;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.bar i{display:block;height:100%;border-radius:4px}
.taste{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px}
.taste .g{grid-template-columns:96px 1fr 34px}
.bays{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;align-items:center}
.bay{display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:7px;border:1px solid var(--line);font:600 13px/1 var(--f-ui);letter-spacing:.03em;white-space:nowrap;background:var(--panel2)}
.bay.on{border-color:var(--amber);color:var(--amber)}
.bay i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(255,255,255,.3)}
.baycount{font:600 11px/1 var(--f-num);color:var(--muted);white-space:nowrap;padding-left:4px}
.list{display:grid;gap:10px}
.card{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px;text-align:left;width:100%}
.card.on{border-color:var(--amber)}
.card img,.card .ph{width:118px;height:66px;object-fit:cover;border-radius:6px;background:#0d0e10}
.card .ttl{font:700 16px/1.1 var(--f-ui);letter-spacing:.02em}
.card .meta{font:500 12.5px/1.25 var(--f-ui);letter-spacing:.04em;color:var(--muted);text-transform:uppercase;margin-top:2px}
.card .price{font:600 14px/1 var(--f-num);color:var(--amber);margin-top:6px}
.card .bl{font:italic 400 13px/1.3 var(--f-body);color:#cfc5b1;margin-top:5px}
.detail{background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:12px;margin-top:-4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:9px 12px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);font:700 13px/1 var(--f-ui);letter-spacing:.05em;text-transform:uppercase}
.chip.on{border-color:var(--amber);background:#3a2a10;color:var(--amber)}
.chip small{display:block;font:500 10.5px/1 var(--f-num);color:var(--muted);margin-top:4px;letter-spacing:0;text-transform:none}
.chip.on small{color:#d9b071}
.swatches{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.sw8{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.12);box-shadow:inset 0 -6px 10px rgba(0,0,0,.35),inset 0 4px 6px rgba(255,255,255,.25)}
.sw8.on{outline:2px solid var(--amber);outline-offset:2px}
input[type=color]{width:40px;height:34px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);padding:2px}
input[type=range].h{width:100%;accent-color:var(--amber)}
.costbar{position:sticky;bottom:-18px;margin:16px -16px -18px;padding:12px 16px calc(12px + 0px);background:linear-gradient(180deg,rgba(25,27,30,.85),var(--panel) 30%);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.costbar .c{font:600 15px/1 var(--f-num)}
.costbar .why{font:500 12.5px/1.2 var(--f-ui);color:var(--muted);letter-spacing:.03em;flex-basis:100%}
.rjob{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.rjob .nm{font:700 15px/1 var(--f-ui);letter-spacing:.03em}
.rjob .bar{grid-column:1/-1}
.rjob .acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:22px 4px;text-align:left}
.lock{font:600 11px/1 var(--f-ui);letter-spacing:.1em;color:var(--rust);text-transform:uppercase}
.show{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:12px;display:grid;gap:6px}
.show.today{border-color:var(--amber)}
.show .d{font:700 11px/1 var(--f-ui);letter-spacing:.16em;color:var(--amber);text-transform:uppercase}
.lvl{background:var(--panel2);border-radius:9px;padding:12px}
.lvl .bar{height:10px;margin-top:8px}
.mile{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line);font:600 14px/1.2 var(--f-ui)}
.mile.done{color:var(--good)}
.mile span{color:var(--muted);font-weight:500;font-size:13px}
.req{display:flex;gap:8px;font:600 13.5px/1.3 var(--f-ui);letter-spacing:.02em}
.req.ok{color:var(--good)} .req.no{color:#d98a70}
/* Modal */
#modal{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,6,7,.55);padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){#modal{align-items:center}}
body.titling #modal{z-index:40}
.mcard{width:min(460px,100%);max-height:86%;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.mcard .eyebrow{font:700 11px/1 var(--f-ui);letter-spacing:.18em;text-transform:uppercase;color:var(--amber);margin-bottom:6px}
.offer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.offer .who{font:700 15px/1.1 var(--f-ui)}
.offer .say{grid-column:1;font:italic 13px/1.3 var(--f-body);color:#cfc5b1}
.offer .amt{font:600 15px/1 var(--f-num);grid-row:1/span 2;grid-column:2;text-align:right}
.pips{display:inline-flex;gap:4px;vertical-align:middle}
.pips i{width:10px;height:10px;border-radius:50%;background:var(--raise)}
.pips i.on{background:var(--amber)}
.say-line{font:italic 15px/1.35 var(--f-body);color:#eadfc8;border-left:3px solid var(--amber);padding:4px 0 4px 10px;margin:10px 0}
.big{font:600 26px/1 var(--f-num);color:var(--amber)}
/* Hop meter */
#hop{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:4;width:min(380px,calc(100% - 24px));background:rgba(17,19,21,.9);border:1px solid var(--amber);border-radius:12px;padding:12px}
#hop .meter{position:relative;height:22px;border-radius:6px;background:linear-gradient(90deg,#3a2120,#7a3a1c 30%,#e9a23b 46%,#fff1c8 50%,#e9a23b 54%,#7a3a1c 70%,#3a2120);margin:8px 0}
#hop .needle{position:absolute;top:-4px;bottom:-4px;width:4px;background:#fff;border-radius:2px;box-shadow:0 0 8px #fff}
#hop .r{display:flex;justify-content:space-between;align-items:center;gap:10px}
/* Title */
#title{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end;padding:24px 20px calc(28px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(10,8,6,0) 25%,rgba(10,8,6,.55) 55%,rgba(10,8,6,.92))}
#title .logo{font:clamp(44px,13vw,96px)/.88 var(--f-disp);letter-spacing:-.01em;color:var(--cream);text-shadow:0 6px 30px rgba(0,0,0,.6);text-wrap:balance;max-width:11ch}
#title .logo em{font-style:normal;color:var(--amber);display:block}
#title .tag{font:600 16px/1.3 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:#e7d8bb;margin:12px 0 22px;max-width:40ch}
#title .row{margin:0}
.badge{display:inline-block;font:700 10px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;padding:4px 6px;border-radius:4px;background:var(--raise);color:var(--muted);vertical-align:middle}
.badge.a{background:#3a2a10;color:var(--amber)} .badge.t{background:#173430;color:var(--teal)} .badge.r{background:#3a1a10;color:#f09a78}
.rb{display:inline-flex;align-items:center;gap:5px;font:700 10px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;padding:4px 7px 4px 6px;border-radius:4px;color:var(--c);background:color-mix(in srgb,var(--c) 16%,#121315);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);vertical-align:middle;white-space:nowrap}
.rb::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font:600 11px/1 var(--f-ui);letter-spacing:.06em;padding:4px 6px;border-radius:4px;background:var(--raise);color:#d8cdb6}

  const rep=S?Math.min(S.rep,150)/150:0;
  const ws=Object.entries(RARITY).map(([k,r])=>[k,r.w*(k==='uncommon'?(rareSpot?1.25:1):k==='rare'?(rareSpot?1.9:1)*(1+rep*.6):k==='legendary'?(rareSpot?2.2:1)*(1+rep):1)]);

}

    wheels:{style:M.era==='50s'?'hubcap':'steelie',size:M.era==='70s'?16:15,ww:M.era==='50s'&&Math.random()<.5},
    susp:{kit:'stock',f:.6,r:.6,hy:{FL:0,FR:0,RL:0,RR:0}},
    mods:{engine:'stock',bumpers:'chrome',bed:'wood',stripe:null},
    paid:0,spent:0,miles:randi(40,260)*1000,days:0};
  if(o.dry)t.cond.frame=Math.min(100,t.cond.frame+28);
  // rarity + factory options
  t.rar=o.rar||rollRarity(o.rare);
  if(id==='longhorn'){const f={common:1,uncommon:1.4,rare:2,legendary:2.6}[t.rar]||1;t.cfg={crew:o.cfg?.crew??Math.random()<.14*f,drw:o.cfg?.drw??Math.random()<.12*f}}

  t.opts=t.rar==='legendary'?[pick(OPTS.legendary),...pickN(OPTS.rare,1),...pickN(OPTS.uncommon,1)]:t.rar==='rare'?[...pickN(OPTS.rare,1),...pickN(OPTS.uncommon,1)]:no?pickN(OPTS.uncommon,1):[];
  if(t.opts.includes('Factory two-tone'))t.origRoof=pick(['#e9e2d0','#f1efe8','#d8cfb7']);
  if(t.opts.includes('Low-production color'))t.origColor=pick(['#c58a3c','#6d8f8a','#8c4a6a','#b6a14a']);

  t.dmg={miss:[],swap:{},glass:0,dents:0};t.wx={rk:1,fk:1};
  const story=o.story||(base<.3?(Math.random()<.6?'beater':'farm'):base<.62?pick(['driver','driver','survivor','farm']):(Math.random()<.55?'resto':'survivor'));
  t.story=story;const D=t.dmg,glbOK=HAS_GLB(id);
  const swapPool=['doorL','doorR','fenderL','fenderR','hood','tailgate','bedL','bedR'].filter(p=>t.bed!=='panel'||!/^(tailgate|bed)/.test(p));
  const swapCol=()=>Math.random()<.45?'primer':pick(M.colors.filter(c=>c!==t.origColor));
  if(story==='beater'){t.wx={rk:1.2,fk:1.15};D.dents=rand(.6,1);D.glass=Math.random()<.7?(Math.random()<.5?2:1):0;
    if(glbOK)D.miss=pickN(['hood','tailgate','bumperF','bumperR','grille','doorL','doorR','tailgate','bumperR'],randi(1,3)).filter((v,i,a)=>a.indexOf(v)===i);
    for(const p of pickN(swapPool.filter(p=>!D.miss.includes(p)),randi(1,3)))D.swap[p]=swapCol()}
  else if(story==='farm'){t.wx={rk:1,fk:1.2};D.dents=rand(.35,.7);D.glass=Math.random()<.3?1:0;
    if(glbOK&&Math.random()<.5)D.miss=[pick(['tailgate','bumperR','grille'])];
    for(const p of pickN(swapPool.filter(p=>!D.miss.includes(p)),randi(0,2)))D.swap[p]=swapCol()}
  else if(story==='driver'){t.wx={rk:.85,fk:1};D.dents=rand(.15,.4);D.glass=Math.random()<.15?1:0;
    if(Math.random()<.6)D.swap[pick(swapPool)]='primer'}
  else if(story==='survivor'){t.wx={rk:.45,fk:1.1};D.dents=rand(0,.12);
    t.cond.body=Math.round(clamp(base*100+rand(-6,8),30,88));for(const k of['frame','engine','interior','trim'])t.cond[k]=Math.min(100,t.cond[k]+12)}

}

  else if(kind==='lvl'){[60,64,67,72,76,79].forEach((m,i)=>pluck(D,t+i*.07,m,.3,{bright:.8,damp:.997,dur:1.6}));strum(D,t+.5,[60,64,67,72,76],.22,{bright:.7,dur:2.2});DR.kick(D,t+.5,.4)}
  else if(kind==='cheer'){crowdCheer(c,D,t,1)}
  else if(kind==='clap'){crowdCheer(c,D,t,.35)}
  else if(kind==='sold'){sfx('cash');setTimeout(()=>sfx('jingle'),250)}
}
function engineStart(c,D,t){
  // starter crank, catch, rev, settle to a lumpy idle
  const st=c.createOscillator();st.type='square';st.frequency.value=170;const stg=c.createGain();stg.gain.value=0;const stl=c.createOscillator();stl.frequency.value=8.5;const stlg=c.createGain();stlg.gain.value=.08;stl.connect(stlg);stlg.connect(stg.gain);
  const stf=c.createBiquadFilter();stf.type='lowpass';stf.frequency.value=900;st.connect(stg);stg.connect(stf);stf.connect(D);st.start(t);stl.start(t);st.stop(t+.75);stl.stop(t+.75);
  const o=c.createOscillator();o.type='sawtooth';const o2=c.createOscillator();o2.type='square';const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=520;lp.Q.value=2;const g=c.createGain();
  const lump=c.createOscillator();lump.frequency.value=4.2;const lg=c.createGain();lg.gain.value=4;lump.connect(lg);lg.connect(o.frequency);lg.connect(o2.frequency);
  const T=t+.7;o.frequency.setValueAtTime(22,T);o.frequency.exponentialRampToValueAtTime(70,T+.35);o.frequency.exponentialRampToValueAtTime(34,T+1.1);o2.frequency.setValueAtTime(11,T);o2.frequency.exponentialRampToValueAtTime(35,T+.35);o2.frequency.exponentialRampToValueAtTime(17,T+1.1);
  g.gain.setValueAtTime(.0001,T);g.gain.exponentialRampToValueAtTime(.26,T+.08);g.gain.setValueAtTime(.26,T+.5);g.gain.exponentialRampToValueAtTime(.13,T+1.2);g.gain.setValueAtTime(.13,T+2.2);g.gain.exponentialRampToValueAtTime(.0001,T+2.9);
  o.connect(lp);o2.connect(lp);lp.connect(g);g.connect(D);for(const x of[o,o2,lump]){x.start(T);x.stop(T+3)}
  nz(D,T,.25,'lowpass',300,1,.3,.005);
}
function crowdCheer(c,D,t,k){
  for(const [f,g] of[[700,.22],[1400,.12],[2600,.05]]){const fl=nz(D,t,2.4*k+.6,'bandpass',f,.7,g*k,.25)}
  for(let i=0;i<Math.floor(26*k);i++)nz(D,t+Math.random()*1.8*k,.05,'bandpass',1100+Math.random()*900,1.2,.16);
  if(k>.6)for(let i=0;i<2;i++){const o=tone(D,t+.3+i*.5,'sine',1900,2900,.35,.05,.02);o.frequency.exponentialRampToValueAtTime(2100,t+.3+i*.5+.35)}
}

function genListing(){
  const t=genTruck({cond:[.12,.78]});const v=value(t),c=condScore(t);

  return {id:uid(),t,asking,min:asking*rand(.7,.92),patience:3,seller:pick(SELLERS),town:pick(TOWNS),blurb:pick((t.rar==='rare'||t.rar==='legendary')&&Math.random()<.6?BLURB.rare:t.story==='survivor'?BLURB.survivor:t.story==='beater'?BLURB.beater:t.story==='resto'?BLURB.high:c<.35?BLURB.low:BLURB.mid),scene:pick(['road','road','barn','field']),inspected:false,day:S.day,log:[]};

function ensureShows(){
  S.shows=S.shows.filter(s=>s.day>=S.day);
  let last=S.shows.length?S.shows[S.shows.length-1].day:S.day;
  const cats=Object.keys(SHOWCAT);
  while(S.shows.length<3){last+=S.shows.length||last>S.day?3:2;S.shows.push({day:last,cat:pick(cats),id:uid()})}
}
function genComm(){
  const c=clone(pick(COMM));const era=pick(['50s','60s','70s',null]);
  return {id:uid(),who:c.who,say:c.say,req:{...c.req,era},pay:r50(rand(...c.pay)+(era?2500:0)),rep:10,until:S.day+10};
}
function nextDay(n=1,quiet=false){
  for(let i=0;i<n;i++){
    S.day++;
    S.listings=S.listings.filter(l=>S.day-l.day<7);
    const add=S.listings.length<3?2:Math.random()<.6?1:0;
    for(let k=0;k<add&&S.listings.length<6;k++)S.listings.unshift(genListing());
    ensureShows();
    S.comms=S.comms.filter(c=>c.until>=S.day);
    if(S.rep>=15&&S.comms.length<2&&Math.random()<.5)S.comms.push(genComm());
    for(const t of S.trucks)t.offers=null;
  }
  if(!quiet)sfx('day');
  if(!quiet)toast(`Day ${S.day}${S.shows.some(s=>s.day===S.day)?' · Show today':''}`);
  save();
}

function rScout(){

  if(f.kind==='sign'){
    body=`<div class="d">${sc.spot.name} · find ${sc.i+1} of ${sc.finds.length}</div><h3>FOR SALE sign in the windshield</h3><p>A ${T} parked by a mailbox outside ${f.town}. The owner's already walking down the drive.</p>`;
    acts=`<button class="btn" data-a="fhaggle">Talk price</button><button class="btn ghost" data-a="fnext">Keep driving</button>`;
  }else if(f.kind==='abandoned'||f.kind==='field'){
    if(step===0){body=`<div class="d">${sc.spot.name}</div><h3>Half swallowed by weeds</h3><p>A ${T} sitting in a field with no plates and flat tires. Nobody around for a mile.</p>`;
      acts=`<button class="btn" data-a="ftrack">Track down the owner · $60</button><button class="btn ghost" data-a="fnext">Leave it</button>`}

    else{body=`<h3>Dead end</h3><div class="say-line">“Not for sale. I'm gonna fix it up someday.”</div>`;acts=`<button class="btn" data-a="fnext">Keep looking</button>`}
  }else if(f.kind==='barn'){
    if(step===0){body=`<div class="d">${sc.spot.name}</div><h3>Behind the barn door</h3><p>An old-timer drags the door open. Dust, light, and a ${T} sitting on four flats.</p><div class="say-line">“That was my dad's truck. Haven't turned it over since '84.”</div>`;
      acts=`<button class="btn" data-a="fplans">Tell him your plans</button><button class="btn ghost" data-a="fcash">Wave cash · ${money(f.cashOffer)}</button><button class="btn ghost" data-a="fnext">Thank him and go</button>`}

    body=`<div class="d">${sc.spot.name} · row ${randiSeed(f)}</div><h3>Salvage row</h3><p>A ${T} sitting on its axles between two engine piles. Yard sells by the pound, no haggling.</p>`;

  }
  return `<div class="show">${body}<div style="margin-top:4px">${rbadge(f.t)}</div>${tagsHTML(f.t)}${gauges(f.t,['frame','engine'])}<div class="row">${acts}</div></div>`;

function startDraft(){const t=sel();if(!t){UI.draft=null;return}UI.draft={id:t.id,paint:clone(t.paint),wheels:clone(t.wheels),kit:t.susp.kit,mods:clone(t.mods)}}
function draftCost(){
  const t=sel(),d=UI.draft;if(!t||!d)return{cost:0,days:0,items:[]};
  const items=[];let cost=0,days=0;
  const P0=t.paint,P1=d.paint;
  if(JSON.stringify(P0)!==JSON.stringify(P1)){
    if(P1.mode==='original'&&P1.clear&&!P0.clear){cost+=900;days+=1;items.push('patina clear')}
    if(P1.mode==='paint'){const c=FINISH[P1.finish].cost+(P1.roof?600:0);cost+=c;days+=P1.finish==='candy'?2:1;items.push(FINISH[P1.finish].n.toLowerCase()+' paint'+(P1.roof?' two-tone':''))}
  }
  if(JSON.stringify(t.wheels)!==JSON.stringify(d.wheels)){const w=d.wheels;const c=WHEELS[w.style].cost+Math.max(0,w.size-15)*60+(w.ww?200:0);cost+=c;items.push('wheels & tires')}
  if(t.susp.kit!==d.kit){cost+=KITS[d.kit].cost;days+=KITS[d.kit].days;items.push(KITS[d.kit].n.toLowerCase())}
  if(t.mods.bumpers!==d.mods.bumpers){cost+=300;items.push('bumpers')}
  if(t.mods.bed!==d.mods.bed){cost+=d.mods.bed==='wood'?700:300;items.push('bed floor')}
  if(t.mods.stripe!==d.mods.stripe&&d.mods.stripe){cost+=350;items.push('pinstripes')}
  return{cost:labor(cost),days,items};
}
function blockers(){
  const t=sel(),d=UI.draft,b=[];if(!t||!d)return b;
  if(d.paint.mode==='paint'&&JSON.stringify(t.paint)!==JSON.stringify(d.paint)&&t.cond.body<70)b.push('Fresh paint needs Body & rust at 70+. Patch the body first or go patina.');
  if(d.paint.mode==='paint'&&JSON.stringify(t.paint)!==JSON.stringify(d.paint)&&(t.dmg?.miss||[]).length)b.push('Source the missing panels before paint (Restore → Panels & parts).');
  if(d.paint.mode==='paint'&&FINISH[d.paint.finish].booth&&!S.upg.booth)b.push('Candy and flake need the paint booth (Career tab).');
  if(d.kit==='hydro'&&t.susp.kit!=='hydro'&&!S.upg.hydro)b.push('Hydraulics need the hydraulic bench (Career tab).');
  return b;
}

const npcMean=()=>52+Math.min(S.rep,160)*.17;
function showScore(t,cat,hop){
  const ts=tastes(t),c=condScore(t),k=t.susp.kit;
  const stance={purist:k==='stock'?1:.3,low:k==='hydro'?1:k==='bags'?.5:.2,pat:k==='bags'?1:k==='drop4'?.8:k==='drop2'?.6:.2,street:k==='bags'?1:k==='drop4'?.7:.3}[cat];
  return 100*(.52*ts[cat]+.36*c+.12*stance)+(hop||0);
}

  h+=`<h4>Shop upgrades</h4><div class="list">${UPG.map(u=>{const own=u.id==='bay'?S.bays>=4:S.upg[u.id];const lock=u.need&&!S.upg[u.need];
    return `<div class="rjob" style="padding:8px 0"><div><div class="nm">${u.n}${u.id==='bay'?` <span class="badge">${S.bays}/4</span>`:''}</div><div class="muted" style="font-size:13px">${u.d}</div></div><div>${own?'<span class="badge t">Owned</span>':lock?'<span class="lock">Needs bench</span>':`<button class="btn sm" data-a="upg" data-id="${u.id}">${money(u.cost)}</button>`}</div></div>`}).join('')}</div>`;
  h+=`<h4>Milestones</h4>${MILES.map(m=>`<div class="mile ${S.miles[m[0]]?'done':''}">${S.miles[m[0]]?'✓':'○'} ${m[1]} <span>${m[2]}</span></div>`).join('')}`;
  h+=`<h4>Coming up</h4><div class="mile">🔒 80s square bodies <span>Unlock at Legend (150 rep)</span></div>`;
  h+=`<div class="row" style="margin-top:22px"><button class="btn ghost sm" data-a="reset">Start over</button></div>`;
  return h;
}
function commReqs(c,t){
  const r=[],q=c.req;
  if(q.era)r.push([`A ${q.era} truck`,t&&MODELS[t.modelId].era===q.era]);
  if(q.kit)r.push([q.kit.map(k=>KITS[k].n).join(' or '),t&&q.kit.includes(t.susp.kit)]);
  if(q.wheel)r.push([q.wheel.map(k=>WHEELS[k].n).join(' or ')+(q.minSize?` at ${q.minSize}"+`:''),t&&q.wheel.includes(t.wheels.style)&&(!q.minSize||t.wheels.size>=q.minSize)]);
  if(q.paint==='clear')r.push(['Patina with clear coat',t&&t.paint.mode==='original'&&t.paint.clear]);
  if(q.finish)r.push([q.finish.map(f=>FINISH[f].n).join(' / ')+' paint',t&&t.paint.mode==='paint'&&q.finish.includes(t.paint.finish)]);
  const mc=q.minCond||.6;r.push([`Overall condition ${Math.round(mc*100)}%+`,t&&condScore(t)>=mc]);
  return r;
}

let danceTimer=null;
function hydro(cmd){
  const t=viewTruck;if(!t)return;const h=t.susp.hy;const UP=.3,DN=-.2;
  if(danceTimer&&cmd!=='dance'){clearInterval(danceTimer);danceTimer=null}
  switch(cmd){
    case'F+':h.FL=h.FR=UP;break;case'F-':h.FL=h.FR=DN;break;case'B+':h.RL=h.RR=UP;break;case'B-':h.RL=h.RR=DN;break;
    case'L':h.FL=h.RL=.28;h.FR=h.RR=-.15;break;case'R':h.FR=h.RR=.28;h.FL=h.RL=-.15;break;
    case'3w':Object.assign(h,{FL:.46,FR:-.2,RL:.12,RR:-.2});setTimeout(()=>{if(truck.wheels.find(w=>w.id==='FL').g.position.y>truck.wheels[0].Rt+.12)award('threewheel'),renderAll()},900);break;
    case'lay':for(const k of['FL','FR','RL','RR'])h[k]=truck.lim?truck.lim[k]:DN;break;case'lvl':h.FL=h.FR=h.RL=h.RR=0;break;case'up':h.FL=h.FR=h.RL=h.RR=UP;break;
    case'hop':h.FL=h.FR=0;truck.retarget();truck.hop(S.upg.pumps?5.4:4.1);sfx('pump');setTimeout(()=>sfx('clunk'),420);return;
    case'dance':if(danceTimer){clearInterval(danceTimer);danceTimer=null;return}let i=0;const seq=['F+','B-','B+','F-','L','R','lvl'];danceTimer=setInterval(()=>{hydro(seq[i%seq.length]);i++;if(i>13){clearInterval(danceTimer);danceTimer=null}},450);return;
  }
  sfx('pump');setTimeout(()=>sfx('clunk'),260);truck.retarget();save();
}

  const finish=()=>{cancelAnimationFrame(raf);el.hidden=true;UI.hopping=false;renderSwitchbox();const inches=best*39.37;toast(`Best hop: ${Math.round(inches)} inches`,'gold');done(clamp(inches/3,0,20))};

$('#btnSleep').onclick=()=>{nextDay(1);UI.scout=null;if(UI.tab==='find')refreshGarageView();renderAll()};
$('#btnMute').onclick=()=>{const m=(AU.mode+1)%3;setAudioMode(m);toast(['Music & sound on','Music off · sound effects on','All sound off'][m]);renderHUD()};
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(b&&!b.disabled&&!b.closest('#switchbox,#tabs,#btnMute'))sfx('ui')},true);
$('#btnSpin').onclick=()=>{spin=!spin;renderHUD()};
$('#btnLights').onclick=()=>{S.lights=!S.lights;truck.lights(S.lights);renderHUD();save()};

function previewDraft(){if(UI.tab!=='shop')return;show3D(draftTruck(),'garage')}
function doRestore(k,full){
  const t=sel(),cost=restoreCost(t,k,full);if(!spend(cost))return;
  const days=k==='tires'?0:full?(k==='body'||k==='engine'?3:2):1;
  t.cond[k]=full?100:Math.min(100,t.cond[k]+25);t.spent+=cost;sfx(k==='tires'?'impact':'ratchet');if(full)setTimeout(()=>sfx(k==='engine'?'engine':'wrench'),550);
  if(k==='trim'&&full&&t.dmg)t.dmg.glass=0;
  if(S.tut)S.tut.fixes=(S.tut.fixes||0)+1;
  if(days)nextDay(days,true);
  toast(`${SYS.find(s=>s[0]===k)[1]} → ${t.cond[k]}%${days?` · ${days} day${days>1?'s':''}`:''}`,'good');
  if(t.cond[k]===100)award('fullsys');
  UI.draft=null;save();refreshGarageView();renderAll();
}
function doParts(){
  const t=sel();if(!t||!hasDamage(t))return;const cost=partsCost(t);if(!spend(cost))return;
  const d=t.dmg,n=(d.miss||[]).length+(d.glass?1:0);
  for(const p of d.miss||[])if(/^(hood|door|tailgate)/.test(p)&&t.paint.mode==='original')d.swap[p]=Math.random()<.65?'primer':pick(MODELS[t.modelId].colors.filter(c=>c!==t.origColor));
  d.miss=[];d.glass=0;t.spent+=cost;sfx('ratchet');setTimeout(()=>sfx('door'),500);nextDay(2,true);
  toast(`${n} part${n>1?'s':''} sourced and fitted · 2 days`,'good');
  UI.draft=null;save();refreshGarageView();renderAll();
}
function doInstall(){
  const t=sel(),d=UI.draft,dc=draftCost();if(blockers().length)return;if(!spend(dc.cost))return;
  const newWheels=JSON.stringify(t.wheels)!==JSON.stringify(d.wheels);
  if(d.paint.mode==='paint'&&t.dmg)t.dmg.swap={};
  t.paint=clone(d.paint);t.wheels=clone(d.wheels);t.mods=clone(d.mods);
  if(t.susp.kit!==d.kit){t.susp.kit=d.kit;t.susp.f=.6;t.susp.r=.6;t.susp.hy={FL:0,FR:0,RL:0,RR:0}}
  if(newWheels)t.cond.tires=100;
  t.spent+=dc.cost;sfx(dc.items.some(x=>/paint|clear/.test(x))?'spray':newWheels?'impact':'ratchet');if(dc.days)nextDay(dc.days,true);
  toast(`Installed ${dc.items.join(', ')}${dc.days?` · ${dc.days} day${dc.days>1?'s':''}`:''}`,'good');
  startDraft();save();refreshGarageView();renderAll();
}

/* ================= boot ================= */
function newGame(){
  S=freshState();
  const starter=genTruck({modelId:'roundtop',cond:[.24,.34],story:'farm',rar:'common'});starter.dmg.miss=[];starter.bed='step';starter.origColor='#3f6b4f';starter.paid=0;starter.cond.frame=58;starter.cond.tires=8;
  S.trucks=[starter];
  for(let i=0;i<4;i++)S.listings.push(genListing());ensureShows();
  S.tut={i:0,fixes:0};
  save();$('#title').hidden=true;UI.tab='garage';UI.scout=null;UI.draft=null;
  refreshGarageView(true);renderAll(false);
  modal(`<div class="eyebrow">Day 1</div><h3>Uncle Ray's Roundtop</h3><p>Ray left you two things: a shop with a leaky roof and the ${starter.year} Hartwell that's been sitting behind it since you were a kid. Paint is gone, tires are gone, but the frame's honest.</p><p>Fix it, flip it, or juice it. You've got ${money(S.cash)} and two bays.</p><div class="row"><button class="btn" data-close data-after="welcome">Next</button></div>`);
}
function titleScreen(hasSave){
  const tEl=$('#title');tEl.hidden=false;document.body.classList.add('titling');
  tEl.innerHTML=`<div class="logo">Barn Find <em>Kings</em></div><div class="tag">Drag them out of fields and barns. Patina, paint, air and juice. Build a name.</div><div class="row">${hasSave?'<button class="btn" id="tCont">Continue</button><button class="btn ghost" id="tNew">New game</button>':'<button class="btn" id="tNew">Start the shop</button>'}<button class="btn ghost" id="tHow">How to play</button></div>`;
  const demo=genTruck({modelId:'sidewinder',cond:[.9,.95],story:'resto',rar:'rare'});demo.bed='fleet';demo.paint={mode:'paint',color:'#3aa6a0',roof:'#efe3c2',finish:'gloss',clear:false};demo.wheels={style:'smoothie',size:15,ww:true};demo.susp={kit:'bags',f:.0,r:.0,hy:{}};
  S=S||freshState();
  show3D(demo,'road',{home:true,instant:true,label:'Rolling out'});spin=true;$('#plate').style.visibility='hidden';
  $('#tNew').onclick=()=>{ac();spin=false;document.body.classList.remove('titling');$('#plate').style.visibility='';newGame()};
  $('#tHow').onclick=()=>{ac();modal(howtoHTML())};
  if(hasSave)$('#tCont').onclick=()=>{ac();spin=false;document.body.classList.remove('titling');$('#plate').style.visibility='';S=hasSave;tEl.hidden=true;try{migrate();ensureShows();refreshGarageView(true);renderAll(false)}catch(e){showErr('loading save: '+e.message)}};
}
function migrate(){if(S.radio===undefined)S.radio=1;for(const t of[...(S.trucks||[]),...(S.listings||[]).map(l=>l.t).filter(Boolean)]){if(t.modelId==='sidewinder')t.bed='fleet';
    if(!t.rar)t.rar='common';if(!t.opts)t.opts=[];if(t.modelId==='longhorn'&&!t.cfg)t.cfg={crew:false,drw:false};if(!t.wx)t.wx={rk:1,fk:1};
    if(!t.dmg)t.dmg={miss:[],swap:{},glass:0,dents:t.cond.body<40?.35:t.cond.body<65?.15:0};
    if(!t.story)t.story=t.paint.mode==='paint'?'resto':t.cond.body<30?'farm':'driver'}S.upg=S.upg||{};S.miles=S.miles||{};S.stats=S.stats||{flips:0,profit:0,shows:0,wins:0};S.comms=S.comms||[];S.shows=S.shows||[];for(const t of S.trucks){t.susp.hy=t.susp.hy||{FL:0,FR:0,RL:0,RR:0}}if(S.sel>=S.trucks.length)S.sel=0}
function start(hot){
  resize();camHome();loop();loadTruckModels();
  if(hot&&hot.S){S=hot.S;migrate();$('#title').hidden=true;refreshGarageView(true);renderAll(false);return}
  titleScreen(loadSave());
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
